name: Deploy frontend

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: blacksilver-front-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    timeout-minutes: 20
    continue-on-error: true
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: "443"
      VITE_REVERB_SCHEME: https
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint (informativo)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package artifact
        run: |
          mkdir -p out/frontend
          cp -r dist/. out/frontend/
          printf '{"sha":"%s","branch":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" \
            > out/frontend/commit.json
          tar -C out -czf "frontend-${GITHUB_SHA}.tar.gz" frontend
          (cd out && sha256sum "frontend-${GITHUB_SHA}.tar.gz" > "frontend-${GITHUB_SHA}.tar.gz.sha256")

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s' "$DEPLOY_SSH_KEY" | head -n1 | grep -q '-----BEGIN' \
            || { echo 'DEPLOY_SSH_KEY no parece una llave privada'; exit 1; }
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keyscan -t ed25519 -H "${{ secrets.DEPLOY_HOST }}" 2>/dev/null \
            | grep -F "$SSH_KNOWN_HOSTS" \
            >> "$HOME/.ssh/known_hosts" || true

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            target="front"
          else
            target="front-dev"
          fi
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o PubkeyAcceptedAlgorithms=+ssh-ed25519 \
            "frontend-${GITHUB_SHA}.tar.gz" \
            "frontend-${GITHUB_SHA}.tar.gz.sha256" \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/blacksilver/incoming/${target}/"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o PubkeyAcceptedAlgorithms=+ssh-ed25519 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/blacksilver-deploy front '$GITHUB_REF_NAME' '$GITHUB_SHA'"